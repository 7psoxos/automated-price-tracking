name: VapeStation Price War - Daily Scrape

on:
  schedule:
    - cron: '0 1 * * *'  # 1 AM UTC = 3 AM UTC+2 (Ελληνική ώρα)
  workflow_dispatch:  # Χειροκίνητη εκτέλεση

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-dotenv supabase
      
      - name: Run price scraper
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python check_prices.py
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: scrape-logs-${{ github.run_id }}
          path: scrape_*.log
          retention-days: 7
